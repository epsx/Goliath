name: Build Goliath

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows UCRT64
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Set up MSYS2 UCRT64
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        with:
          msystem: UCRT64
          update: true
          cache: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-sdl3

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure
        run: >-
          cmake -S . -B build-ci -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTS=ON

      - name: Build
        run: cmake --build build-ci -j$(nproc)

      - name: Test
        run: ctest --test-dir build-ci --output-on-failure

      - name: Stage Windows frontend
        run: |
          set -euo pipefail

          stage="$PWD/dist/Goliath-Windows-x86_64"
          mkdir -p "$stage"

          cp build-ci/goliath-qt.exe "$stage/"
          cp LICENSE THIRD-PARTY-NOTICES.md "$stage/"
          cp -R licenses "$stage/"

          windeployqt6.exe --release "$stage/goliath-qt.exe"
          cp /ucrt64/bin/SDL3.dll "$stage/"

          for pass in 1 2 3 4 5; do
            copied=0
            while IFS= read -r dependency; do
              filename=$(basename "$dependency")
              if [ ! -f "$stage/$filename" ]; then
                cp "$dependency" "$stage/$filename"
                copied=1
              fi
            done < <(
              find "$stage" -type f \
                \( -iname '*.exe' -o -iname '*.dll' \) -print0 |
              while IFS= read -r -d '' binary; do
                ldd "$binary" 2>/dev/null || true
              done |
              awk '$3 ~ /^\/ucrt64\/bin\/.*\.[dD][lL][lL]$/ { print $3 }' |
              sort -u
            )

            if [ "$copied" -eq 0 ]; then
              break
            fi
          done

          (
            cd "$stage/licenses"
            sha256sum -c SHA256SUMS
          )

          # Release notices describe this exact MSYS2 package set. Stop the
          # build if the rolling runner has updated any runtime dependency.
          expected_packages=(
            'qt6-base 6.11.2-2' 'sdl3 3.4.16-1'
            'libb2 0.98.1-3' 'brotli 1.2.0-1' 'bzip2 1.0.8-4'
            'double-conversion 3.4.0-1' 'libffi 3.8.0-1'
            'freetype 2.14.3-1' 'libgcc 16.2.0-4'
            'libstdc++ 16.2.0-4' 'glib2 2.90.0-1'
            'graphite2 1.3.15-1' 'harfbuzz 14.5.0-1'
            'libiconv 1.19-1' 'libjpeg-turbo 3.2.0-1'
            'icu 78.3-4' 'gettext-runtime 1.0-1' 'md4c 0.5.3-1'
            'pcre2 10.48-3' 'libpng 1.6.58-1'
            'libwinpthread 14.0.0.r420.g61d40c4c0-1'
            'zstd 1.5.7-2' 'zlib 1.3.2-2'
          )
          for expected in "${expected_packages[@]}"; do
            read -r package_name package_version <<< "$expected"
            installed_version=$(pacman -Q "mingw-w64-ucrt-x86_64-$package_name")
            if [ "$installed_version" != "mingw-w64-ucrt-x86_64-$expected" ]; then
              printf 'Package version changed: expected %s, found %s\n' \
                "$expected" "$installed_version" >&2
              exit 1
            fi
          done

          # Every DLL in the portable root comes from the installed runtime.
          # Refresh its complete license directory from that very package.
          declare -A seen_packages=()
          while IFS= read -r -d '' runtime; do
            filename=$(basename "$runtime")
            installed="/ucrt64/bin/$filename"
            if [ ! -f "$installed" ]; then
              printf 'Installed DLL missing: %s\n' "$filename" >&2
              exit 1
            fi
            package=$(pacman -Qoq "$installed")
            license_dir=${package#mingw-w64-ucrt-x86_64-}
            if [ "$license_dir" = "$package" ]; then
              printf 'Unexpected DLL package: %s (%s)\n' "$filename" "$package" >&2
              exit 1
            fi
            if [ -n "${seen_packages[$package]+x}" ]; then
              continue
            fi
            seen_packages[$package]=1
            installed_licenses=$(find /ucrt64/share/licenses \
              -mindepth 1 -maxdepth 1 -type d \
              -iname "$license_dir" -print -quit)
            if [ -z "$installed_licenses" ]; then
              printf 'Missing installed licenses for %s (%s)\n' \
                "$filename" "$package" >&2
              exit 1
            fi
            target="$stage/licenses/msys2/$(basename "$installed_licenses")"
            if [ -d "$target" ]; then
              rm -r -- "$target"
            fi
            cp -R -- "$installed_licenses" "$stage/licenses/msys2/"
          done < <(find "$stage" -maxdepth 1 -type f -iname '*.dll' -print0)
          (
            cd "$stage/licenses"
            find . -type f ! -name SHA256SUMS ! -name SHA256SUMS.new -print0 |
              sort -z | xargs -0 sha256sum > SHA256SUMS.new
            mv SHA256SUMS.new SHA256SUMS
            sha256sum -c SHA256SUMS
          )

          manifest="$stage/DEPENDENCIES.txt"
          : > "$manifest"
          while IFS= read -r -d '' binary; do
            relative=${binary#"$stage"/}
            printf '[%s]\n' "$relative" >> "$manifest"
            ldd "$binary" >> "$manifest" 2>&1 || true
            printf '\n' >> "$manifest"
          done < <(
            find "$stage" -type f \
              \( -iname '*.exe' -o -iname '*.dll' \) -print0
          )

          if grep -qi 'not found' "$manifest"; then
            cat "$manifest"
            exit 1
          fi

      - name: Upload Windows frontend
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Goliath-Windows-x86_64
          path: dist/Goliath-Windows-x86_64
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Linux x86_64
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            cmake \
            ninja-build \
            qt6-base-dev

      - name: Build and cache SDL3
        id: sdl
        uses: libsdl-org/setup-sdl@30cb786f3595c27d05018cd374b679f2313c59d3 # v1.0.1
        with:
          version: 3.4.12
          build-type: Release
          install-linux-dependencies: true

      - name: Configure
        run: >-
          cmake -S . -B build-ci -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTS=ON
          -DCMAKE_PREFIX_PATH="${{ steps.sdl.outputs.prefix }}"

      - name: Build
        run: cmake --build build-ci -j$(nproc)

      - name: Test
        run: ctest --test-dir build-ci --output-on-failure

      - name: Stage Linux frontend
        run: |
          set -euo pipefail

          stage="$PWD/dist/Goliath-Linux-x86_64"
          mkdir -p "$stage"

          cp build-ci/goliath-qt "$stage/"
          cp LICENSE THIRD-PARTY-NOTICES.md "$stage/"
          cp -R licenses "$stage/"

          (
            cd "$stage/licenses"
            sha256sum -c SHA256SUMS
          )

          ldd "$stage/goliath-qt" | tee "$stage/DEPENDENCIES.txt"
          if grep -qi 'not found' "$stage/DEPENDENCIES.txt"; then
            exit 1
          fi

      - name: Upload Linux frontend
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Goliath-Linux-x86_64
          path: dist/Goliath-Linux-x86_64
          if-no-files-found: error
          retention-days: 14
